<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>flush_and_rush</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #060b14;
      --text: #f4f7fb;
      --muted: #a8b3c4;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --timer-color: var(--green);
      --track-bg: #101b2d;
      --fastest-color: #34d399;
      --median-color: #fbbf24;
      --longest-color: #f87171;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
    }

    .timer-half {
      height: 50vh;
      display: grid;
      place-items: center;
      gap: 12px;
      text-align: center;
      background:
        radial-gradient(circle at top, rgba(125, 211, 252, 0.16), transparent 32%),
        var(--bg);
    }

    #timer {
      font-size: 33vh;
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -0.06em;
      font-variant-numeric: tabular-nums;
      color: var(--timer-color);
      text-shadow: 0 0 60px color-mix(in srgb, var(--timer-color) 45%, transparent);
      transition: color 500ms ease, text-shadow 500ms ease;
    }

    .progress-half {
      height: 50vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 6vw;
      transition: opacity 300ms ease;
    }

    .progress-half.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .track-wrapper {
      position: relative;
      padding-top: 58px;
    }

    .marker {
      position: absolute;
      top: 0;
      height: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      transform: translateX(-50%);
      transition: left 700ms ease;
      z-index: 2;
    }

    .marker-label {
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .marker-icon {
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 12px solid currentColor;
      filter: drop-shadow(0 0 5px currentColor);
    }

    .marker.fastest { color: var(--fastest-color); }
    .marker.median { color: var(--median-color); }
    .marker.longest { color: var(--longest-color); }

    .progress-track {
      position: relative;
      height: 44px;
      border-radius: 22px;
      background: var(--track-bg);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 22px;
      background: linear-gradient(90deg, var(--green), var(--timer-color));
      transition: width 250ms linear;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
    }

    .result-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease;
      z-index: 40;
    }

    .result-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .metrics-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(20px, 4vw, 56px);
      background:
        radial-gradient(circle at top, rgba(125, 211, 252, 0.12), transparent 36%),
        var(--bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease;
      z-index: 30;
    }

    .metrics-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .metrics-grid {
      width: min(1100px, 100%);
      display: grid;
      gap: clamp(14px, 2vw, 24px);
    }

    @media (orientation: landscape) {
      .metrics-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (orientation: portrait) {
      .metrics-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .metric-card {
      min-height: 180px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 10px;
      padding: clamp(20px, 4vw, 36px);
      border-radius: 28px;
      background: rgba(16, 27, 45, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      text-align: center;
      backdrop-filter: blur(14px);
    }

    .metric-label {
      font-size: clamp(1rem, 2vw, 1.45rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .metric-value {
      font-size: clamp(2.2rem, 7vw, 5rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      text-wrap: balance;
    }

    .metric-card.fastest .metric-value { color: var(--fastest-color); }
    .metric-card.median .metric-value { color: var(--median-color); }
    .metric-card.longest .metric-value { color: var(--longest-color); }

    #resultDuration {
      font-size: clamp(4rem, 16vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    #resultMessage {
      font-size: clamp(1.3rem, 4vw, 2.2rem);
      font-weight: 800;
      color: var(--timer-color);
      max-width: 90vw;
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas" aria-hidden="true"></canvas>

  <main class="app">
    <section class="timer-half">
      <div id="timer">00:00</div>
    </section>
    <section class="progress-half hidden" id="progressHalf">
      <div class="track-wrapper" id="trackWrapper">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="result-overlay" id="resultOverlay">
    <div id="resultDuration">00:00</div>
    <div id="resultMessage"></div>
  </div>

  <div class="metrics-overlay" id="metricsOverlay">
    <div class="metrics-grid" id="metricsGrid">
      <div class="metric-card fastest">
        <div class="metric-label">Kürzeste</div>
        <div class="metric-value" id="metricFastest">--:--</div>
      </div>
      <div class="metric-card median">
        <div class="metric-label">Median</div>
        <div class="metric-value" id="metricMedian">--:--</div>
      </div>
      <div class="metric-card longest">
        <div class="metric-label">Längste</div>
        <div class="metric-value" id="metricLongest">--:--</div>
      </div>
    </div>
  </div>

  <script>
    const timerEl = document.getElementById('timer');
    const progressHalfEl = document.getElementById('progressHalf');
    const trackWrapperEl = document.getElementById('trackWrapper');
    const progressFillEl = document.getElementById('progressFill');
    const resultOverlayEl = document.getElementById('resultOverlay');
    const resultDurationEl = document.getElementById('resultDuration');
    const resultMessageEl = document.getElementById('resultMessage');
    const metricsOverlayEl = document.getElementById('metricsOverlay');
    const metricFastestEl = document.getElementById('metricFastest');
    const metricMedianEl = document.getElementById('metricMedian');
    const metricLongestEl = document.getElementById('metricLongest');
    const rootStyle = document.documentElement.style;

    let lastColor = null;
    let phase = 'idle';
    let dayStats = { fastest_sec: null, median_sec: null, longest_sec: null, count: 0 };
    let sessionAnchorMs = null; // Date.now() Aequivalent des Session-Starts (aus Server-Elapsed rekonstruiert)
    let shownFinishedSessionId = null;
    let resultTimeoutId = null;
    let markerEls = {};
    let scaleMaxSec = 60; // wird pro Session zurueckgesetzt und waechst in 1-Minuten-Schritten mit

    function getAppBasePath() {
      const trimmedPath = window.location.pathname.replace(/\/+$/, '');
      if (!trimmedPath) return '';
      if (trimmedPath.endsWith('/guest')) return trimmedPath.slice(0, -'/guest'.length);
      return trimmedPath;
    }

    function addonUrl(path) {
      return `${getAppBasePath()}${path}`;
    }

    function addonWsUrl(path) {
      const scheme = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      return `${scheme}${window.location.host}${addonUrl(path)}`;
    }

    function formatDuration(totalSeconds) {
      const safe = Math.max(0, Math.floor(totalSeconds || 0));
      const hours = Math.floor(safe / 3600);
      const minutes = Math.floor((safe % 3600) / 60);
      const seconds = safe % 60;
      if (hours > 0) {
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    // --- Konfetti: leichtgewichtige Canvas-Partikel-Animation ---
    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    const CONFETTI_COLORS = ['#f87171', '#fbbf24', '#34d399', '#7dd3fc', '#c084fc', '#f472b6'];
    let confettiParticles = [];
    let confettiRafId = null;

    function resizeConfettiCanvas() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfettiCanvas);
    resizeConfettiCanvas();

    function spawnConfettiBurst(count) {
      const w = confettiCanvas.width;
      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: Math.random() * w,
          y: -20 - Math.random() * 200,
          vx: (Math.random() - 0.5) * 3.5,
          vy: 2 + Math.random() * 3,
          size: 6 + Math.random() * 7,
          color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 12,
          shape: Math.random() < 0.5 ? 'rect' : 'circle',
          opacity: 1,
        });
      }
    }

    function stepConfetti() {
      const h = confettiCanvas.height;
      confettiCtx.clearRect(0, 0, confettiCanvas.width, h);
      confettiParticles = confettiParticles.filter((p) => p.y < h + 40 && p.opacity > 0);

      for (const p of confettiParticles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.03;
        p.rotation += p.rotationSpeed;
        if (p.y > h * 0.75) p.opacity -= 0.02;

        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate((p.rotation * Math.PI) / 180);
        confettiCtx.globalAlpha = Math.max(0, p.opacity);
        confettiCtx.fillStyle = p.color;
        if (p.shape === 'rect') {
          confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        } else {
          confettiCtx.beginPath();
          confettiCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          confettiCtx.fill();
        }
        confettiCtx.restore();
      }

      if (confettiParticles.length > 0) {
        confettiRafId = requestAnimationFrame(stepConfetti);
      } else {
        confettiRafId = null;
      }
    }

    function launchConfetti() {
      spawnConfettiBurst(220);
      setTimeout(() => spawnConfettiBurst(140), 300);
      if (!confettiRafId) confettiRafId = requestAnimationFrame(stepConfetti);
    }

    // Farbe richtet sich nach der heutigen Bestzeit/Schlechtestzeit, nicht nach fixen Schwellwerten.
    function computeColor(elapsedSec) {
      const fastest = dayStats.fastest_sec;
      const longest = dayStats.longest_sec;
      if (fastest == null || longest == null) return 'green'; // erste Session des Tages: kein Vergleich moeglich
      if (elapsedSec < fastest) return 'green';
      if (elapsedSec >= longest) return 'red';
      return 'yellow';
    }

    function applyColor(elapsedSec) {
      const color = computeColor(elapsedSec);
      if (color !== lastColor) {
        lastColor = color;
        rootStyle.setProperty('--timer-color', `var(--${color})`);
      }
    }

    function ensureMarker(key) {
      if (markerEls[key]) return markerEls[key];
      const marker = document.createElement('div');
      marker.className = `marker ${key}`;
      const label = document.createElement('div');
      label.className = 'marker-label';
      const icon = document.createElement('div');
      icon.className = 'marker-icon';
      marker.appendChild(label);
      marker.appendChild(icon);
      trackWrapperEl.appendChild(marker);
      markerEls[key] = { marker, label, icon };
      return markerEls[key];
    }

    function removeMarker(key) {
      if (markerEls[key]) {
        markerEls[key].marker.remove();
        delete markerEls[key];
      }
    }

    // Skala waechst in festen 1-Minuten-Schritten, sobald Session oder Marker das aktuelle Ende erreichen.
    function extendScaleToFit(liveElapsedSec) {
      const values = [liveElapsedSec, dayStats.fastest_sec, dayStats.median_sec, dayStats.longest_sec];
      let guard = 0;
      while (values.some((v) => v != null && v >= scaleMaxSec) && guard < 1000) {
        scaleMaxSec += 60;
        guard += 1;
      }
    }

    function renderProgress(liveElapsedSec) {
      extendScaleToFit(liveElapsedSec);

      const fillPct = Math.min(100, (liveElapsedSec / scaleMaxSec) * 100);
      progressFillEl.style.width = `${fillPct}%`;

      const markerDefs = [
        { key: 'fastest', value: dayStats.fastest_sec, label: 'K\u00fcrzeste' },
        { key: 'median', value: dayStats.median_sec, label: 'Median' },
        { key: 'longest', value: dayStats.longest_sec, label: 'L\u00e4ngste' },
      ];

      for (const def of markerDefs) {
        if (def.value == null) {
          removeMarker(def.key);
          continue;
        }
        const { marker, label } = ensureMarker(def.key);
        const pct = Math.min(100, (def.value / scaleMaxSec) * 100);
        marker.style.left = `${pct}%`;
        label.textContent = `${def.label} (${formatDuration(def.value)})`;
      }
    }

    function resetScale() {
      const longest = dayStats.longest_sec;
      const base = longest != null ? longest : 60;
      scaleMaxSec = Math.max(60, Math.ceil(base / 60) * 60);
    }

    function updateProgressVisibility() {
      progressHalfEl.classList.toggle('hidden', !dayStats.count);
    }

    function updateMetricValues() {
      metricFastestEl.textContent = dayStats.fastest_sec != null ? formatDuration(dayStats.fastest_sec) : '--:--';
      metricMedianEl.textContent = dayStats.median_sec != null ? formatDuration(dayStats.median_sec) : '--:--';
      metricLongestEl.textContent = dayStats.longest_sec != null ? formatDuration(dayStats.longest_sec) : '--:--';
    }

    function showMetricsOverlay() {
      updateMetricValues();
      metricsOverlayEl.classList.add('visible');
    }

    function hideMetricsOverlay() {
      metricsOverlayEl.classList.remove('visible');
    }

    function clearResultTimeout() {
      if (resultTimeoutId != null) {
        clearTimeout(resultTimeoutId);
        resultTimeoutId = null;
      }
    }

    function scheduleMetricsReveal() {
      clearResultTimeout();
      resultTimeoutId = setTimeout(() => {
        resultTimeoutId = null;
        hideResultOverlay();
        if (dayStats.count) {
          showMetricsOverlay();
        }
      }, 15000);
    }

    function tickRunning() {
      if (phase !== 'running' || sessionAnchorMs == null) return;
      const liveElapsedSec = (Date.now() - sessionAnchorMs) / 1000;
      timerEl.textContent = formatDuration(liveElapsedSec);
      applyColor(liveElapsedSec);
      renderProgress(liveElapsedSec);
    }

    function showResultOverlay(finished) {
      resultDurationEl.textContent = formatDuration(finished.duration_sec);
      resultMessageEl.textContent = finished.message;
      resultOverlayEl.classList.add('visible');
    }

    function hideResultOverlay() {
      resultOverlayEl.classList.remove('visible');
    }

    function handleState(data) {
      dayStats = data.day_stats || dayStats;
      updateMetricValues();
      updateProgressVisibility();

      if (data.phase === 'running') {
        if (phase !== 'running') resetScale();
        phase = 'running';
        hideResultOverlay();
        hideMetricsOverlay();
        clearResultTimeout();
        sessionAnchorMs = Date.now() - (data.elapsed_sec || 0) * 1000;
        tickRunning();
        return;
      }

      // idle
      phase = 'idle';
      sessionAnchorMs = null;
      timerEl.textContent = '00:00';
      renderProgress(0);

      if (data.last_finished) {
        if (data.last_finished.session_id !== shownFinishedSessionId) {
          shownFinishedSessionId = data.last_finished.session_id;
          if (!data.last_finished.is_new_longest) launchConfetti();
          hideMetricsOverlay();
          showResultOverlay(data.last_finished);
          scheduleMetricsReveal();
        }
      } else {
        hideResultOverlay();
        hideMetricsOverlay();
        clearResultTimeout();
      }
    }

    let socket = null;
    let reconnectDelayMs = 1000;

    function connectWebSocket() {
      socket = new WebSocket(addonWsUrl('/ws/guest'));

      socket.addEventListener('open', () => {
        reconnectDelayMs = 1000;
      });

      socket.addEventListener('message', (event) => {
        try {
          const data = JSON.parse(event.data);
          handleState(data);
        } catch (err) {
          // ungueltige Nachricht ignorieren
        }
      });

      socket.addEventListener('close', () => {
        setTimeout(connectWebSocket, reconnectDelayMs);
        reconnectDelayMs = Math.min(reconnectDelayMs * 1.5, 15000);
      });

      socket.addEventListener('error', () => {
        socket.close();
      });
    }

    (async () => {
      setInterval(tickRunning, 200);
      connectWebSocket();
    })();
  </script>
</body>
</html>

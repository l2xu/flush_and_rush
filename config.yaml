name: "Flush & Rush"
description: "Gamification fuer das Gaeste-WC: Sitzungen tracken, claimen und im Leaderboard anzeigen."
version: "0.3.9"
slug: "flush-and-rush"
url: "https://example.com/flush-and-rush"
init: false
startup: services
boot: auto
arch:
  - aarch64
  - amd64

ingress: true
ingress_port: 8099
panel_title: "Flush & Rush"
panel_icon: "mdi:toilet"

homeassistant_api: true

ports:
  8099/tcp: 8080

options:
  sensor_entity_id: "binary_sensor.klodeckel"
  sensor_inverted: false
  # Fade-Transition fuer den Abschluss-Screen (Millisekunden).
  fade_duration_ms: 600

schema:
  sensor_entity_id: str
  sensor_inverted: bool
  fade_duration_ms: int(100,5000)